    --bg:#0B0F14; --surface:#121821; --surface2:#1A2230; --border:#212B38; --border2:#2A3441;

  }

  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;}
  body{padding-bottom:env(safe-area-inset-bottom);}
  #app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:90px;}
  input,textarea,select,button{font-family:inherit;}

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

  .field-label{font-size:11px;color:var(--muted);margin-bottom:8px;letter-spacing:.5px;text-transform:uppercase;}
  .input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 12px;color:var(--text);font-size:14px;outline:none;}
  .input:focus{border-color:var(--gold);}
  .btn-toggle{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;font-size:13px;font-weight:500;border:1px solid var(--border2);background:transparent;color:var(--muted);}
  .btn-toggle.active{color:var(--c);border-color:var(--c);background:color-mix(in srgb, var(--c) 15%, transparent);}
  .chip{padding:6px 12px;border-radius:20px;font-size:12px;border:1px solid var(--border2);background:transparent;color:var(--muted);}
  .chip.active{border-color:var(--gold);background:rgba(212,162,76,0.13);color:var(--gold);}
  .check-row{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);width:100%;}
  .check-row.done{border-color:rgba(79,178,134,0.35);background:#132018;}
  .box{width:18px;height:18px;border-radius:5px;flex-shrink:0;border:1.5px solid #3A4655;display:flex;align-items:center;justify-content:center;}
  .box.done{background:var(--green);border-color:var(--green);}

  const items = STRATEGIES[strategyKey].checklist;
  const c = {};

function ringColorRatio(n, total){ const r = total ? n/total : 0; return r>=0.875 ? "#4FB286" : r>=0.5 ? "#D4A24C" : "#C97064"; }

// Sesyon Lond ak New York, lè Ayiti (Ayiti swiv menm DST ak NY, kidonk NY toujou 8h-17h)
function getSession(dateTimeLocalStr){
  if(!dateTimeLocalStr) return null;
  const parts = dateTimeLocalStr.split("T");
  if(parts.length < 2) return null;
  const [h, m] = parts[1].split(":").map(Number);
  const minutes = h * 60 + m;
  const londonStart = 3*60, londonEnd = 12*60;      // 3h00 - 12h00
  const nyStart = 8*60, nyEnd = 17*60;               // 8h00 - 17h00
  const inLondon = minutes >= londonStart && minutes < londonEnd;
  const inNY = minutes >= nyStart && minutes < nyEnd;
  if(inLondon && inNY) return { label: "Chevauchement Londres + New York", color: "#D4A24C" };
  if(inNY) return { label: "New York", color: "#4FB286" };
  if(inLondon) return { label: "Londres", color: "#8B98A9" };
  return { label: "Hors session", color: "#C97064" };
}
function ringColor(n){ return n>=7 ? "#4FB286" : n>=4 ? "#D4A24C" : "#C97064"; }

/* ---------- Storage (IndexedDB — bien plus de place que localStorage) ---------- */
const IDB_NAME = "le_raid_db";
const IDB_VERSION = 1;
const IDB_STORE = "kv";

function idbOpen(){
  return new Promise((resolve, reject)=>{
    if(!("indexedDB" in window)){ reject(new Error("IndexedDB indisponib")); return; }
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = ()=>{
      const db = req.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, "readonly");
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbSet(key, value){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, "readwrite");
    const req = tx.objectStore(IDB_STORE).put(value, key);
    req.onsuccess = ()=> resolve(true);
    req.onerror = ()=> reject(req.error);
  });
}

async function loadTrades(){
  try{
    let trades = await idbGet(STORAGE_KEY);
    if(trades === undefined){
      // Migrasyon otomatik: si gen ansyen done nan localStorage, pase yo nan IndexedDB
      // epi libere plas la nan localStorage.
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        try{
          trades = JSON.parse(raw);
          await idbSet(STORAGE_KEY, trades);
          localStorage.removeItem(STORAGE_KEY);
        }catch(e){ trades = []; }
      }
    }
    state.trades = trades || [];
    state.trades.sort((a,b)=> (b.date||"").localeCompare(a.date||""));
  }catch(e){
    state.trades = [];
    state.error = "Impossible de charger le journal.";
  }
}
async function persistTrades(){
  try{
    await idbSet(STORAGE_KEY, state.trades);
    return true;
  }catch(e){
    state.error = "Stockage plein — supprime d'anciennes captures ou trades pour libérer de la place.";
    return false;
  }
}

/* ---------- Image handling ---------- */
function resizeImage(file, maxWidth=1000, quality=0.72){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth/img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width*scale;
        canvas.height = img.height*scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ============================= BILAN / WINRATE =============================
function monthKey(dateStr){ return dateStr ? dateStr.slice(0,7) : null; } // "AAAA-MM"
function yearKey(dateStr){ return dateStr ? dateStr.slice(0,4) : null; }
function monthLabel(key){
  const [y,m] = key.split("-");
  return `${MONTH_NAMES[parseInt(m,10)-1]} ${y}`;
}
function computeWinRate(trades){
  const wins = trades.filter(t=>t.result==="gagnant").length;
  const losses = trades.filter(t=>t.result==="perdant").length;
  const be = trades.filter(t=>t.result==="be").length;
  const decided = wins+losses;
  const rate = decided ? Math.round((wins/decided)*1000)/10 : null;
  return { wins, losses, be, total: trades.length, decided, rate };
}
function groupByMonth(trades){
  const map = {};
  trades.forEach(t=>{
    const k = monthKey(t.date);
    if(!k) return;
    if(!map[k]) map[k]=[];
    map[k].push(t);
  });
  return map;
}
function groupByYear(trades){
  const map = {};
  trades.forEach(t=>{
    const k = yearKey(t.date);
    if(!k) return;
    if(!map[k]) map[k]=[];
    map[k].push(t);
  });
  return map;
}
function checkMonthlyRecap(){
  const now = new Date();
  const curMonthKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
  const curYear = String(now.getFullYear());
  let last = null;
  try{ last = JSON.parse(localStorage.getItem(CHECKPOINT_KEY) || "null"); }catch(e){}
  if(!last){
    try{ localStorage.setItem(CHECKPOINT_KEY, JSON.stringify({month: curMonthKey})); }catch(e){}
    return;
  }
  if(last.month !== curMonthKey){
    const prevMonthKey = last.month;
    const prevYear = prevMonthKey.slice(0,4);
    const isYearEnd = prevMonthKey.endsWith("-12") && curYear !== prevYear;
    const trades = isYearEnd
      ? state.trades.filter(t=>yearKey(t.date)===prevYear)
      : state.trades.filter(t=>monthKey(t.date)===prevMonthKey);
    if(trades.length){
      state.recapModal = {
        type: isYearEnd ? "year" : "month",
        label: isYearEnd ? prevYear : monthLabel(prevMonthKey),
        stats: computeWinRate(trades),
      };
    }
    try{ localStorage.setItem(CHECKPOINT_KEY, JSON.stringify({month: curMonthKey})); }catch(e){}
  }
}

// Semèn "trading" la kouri Samdi -> Vandredi. La cle a se dat Samdi ki dèyè a.
function getPeriodKey(dateInput){
  const d = new Date(dateInput);
  const day = d.getDay(); // 0=dim,1=lun,...6=sam
  const diff = (day - 6 + 7) % 7; // konbyen jou depi dènye samdi
  const sat = new Date(d.getFullYear(), d.getMonth(), d.getDate() - diff);
  return `${sat.getFullYear()}-${String(sat.getMonth()+1).padStart(2,"0")}-${String(sat.getDate()).padStart(2,"0")}`;
}
function formatPeriodRange(satKeyStr){
  const sat = new Date(satKeyStr + "T00:00:00");
  const mon = new Date(sat); mon.setDate(sat.getDate()+2);
  const fri = new Date(sat); fri.setDate(sat.getDate()+6);
  const fmt = d => `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}`;
  return `${fmt(mon)} - ${fmt(fri)}`;
}
function checkWeeklyRecap(){
  const now = new Date();
  const curPeriod = getPeriodKey(now);
  let last = null;
  try{ last = JSON.parse(localStorage.getItem(WEEK_CHECKPOINT_KEY) || "null"); }catch(e){}
  if(!last){
    try{ localStorage.setItem(WEEK_CHECKPOINT_KEY, JSON.stringify({period: curPeriod})); }catch(e){}
    return;
  }
  if(last.period !== curPeriod){
    const prevPeriod = last.period;
    const trades = state.trades.filter(t=> t.date && getPeriodKey(t.date) === prevPeriod)
      .sort((a,b)=> (a.date||"").localeCompare(b.date||""));
    if(trades.length){
      state.weeklyRecap = { period: prevPeriod, range: formatPeriodRange(prevPeriod), trades, stats: computeWinRate(trades) };
      state.view = "weeklyrecap";
    }
    try{ localStorage.setItem(WEEK_CHECKPOINT_KEY, JSON.stringify({period: curPeriod})); }catch(e){}
  }
}

/* ---------- Render helpers ---------- */
function el(tag, attrs={}, children=[]){
  const node = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==="class") node.className = v;
    else if(k==="html") node.innerHTML = v;
    else if(k.startsWith("on")) node.addEventListener(k.slice(2).toLowerCase(), v);
    else if(v!==false && v!==null && v!==undefined) node.setAttribute(k,v);
  });
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c===null||c===undefined) return;
    node.appendChild(typeof c==="string" ? document.createTextNode(c) : c);
  });
  return node;
}

function ringSVG(count, total=8, size=44){
  const stroke=4, r=(size-stroke)/2, c=2*Math.PI*r, pct=total ? count/total : 0, color=ringColorRatio(count, total);
  const wrap = el("div",{style:`width:${size}px;height:${size}px;position:relative;`});
  wrap.innerHTML = `
    <svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#2A3441" stroke-width="${stroke}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}"
        style="transition:stroke-dashoffset .4s ease"/>
    </svg>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;">${count}/${total}</div>
  `;
  return wrap;
}

/* ---------- Views ---------- */
function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  app.style.paddingBottom = state.view==="list" ? "90px" : "24px";
  if(state.view==="list") app.appendChild(renderList());
  else if(state.view==="bilan") app.appendChild(renderBilan());
  else if(state.view==="weeklyrecap") app.appendChild(renderWeeklyRecap());
  else app.appendChild(renderForm());
  if(state.recapModal) app.appendChild(renderRecapModal());
  if(state.lightbox) app.appendChild(renderImageLightbox());
}

function renderImageLightbox(){
  const overlay = el("div",{style:"position:fixed;inset:0;background:rgba(0,0,0,0.92);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;",
    onclick:()=>{ state.lightbox = null; render(); }});

    const row = el("div",{style:"display:flex;gap:6px;flex-wrap:wrap;"});
    RESULTS.forEach(r=>{
      row.appendChild(toggleBtn(r.label, f.result===r.key, r.color, null, ()=>{ f.result=r.key; render(); }));
    });
    return row;
  })()));

  // R multiple
  body.appendChild(field("R multiple (optionnel)", (()=>{
    const inp = el("input",{class:"input",placeholder:"ex. +2.1R ou -1R",value:f.rMultiple});
    inp.addEventListener("input", e=> f.rMultiple = e.target.value);
    return inp;
  })()));

  // Emotions
  body.appendChild(field("Émotions ressenties", (()=>{
    const row = el("div",{style:"display:flex;gap:6px;flex-wrap:wrap;"});
    EMOTIONS.forEach(em=>{
      const active = f.emotions.includes(em);
      const chip = el("button",{class:"chip"+(active?" active":"")}, em);
      chip.addEventListener("click", ()=>{
        f.emotions = active ? f.emotions.filter(x=>x!==em) : [...f.emotions, em];
        render();
      });
      row.appendChild(chip);
    });
    return row;
  })()));

  // Notes
  body.appendChild(field("Notes libres", (()=>{
    const ta = el("textarea",{class:"input",rows:4,style:"resize:vertical;",placeholder:"Ce que tu as observé, ce que tu ferais différemment…"}, f.notes);
    ta.value = f.notes;
    ta.addEventListener("input", e=> f.notes = e.target.value);
    return ta;
  })()));

  // Actions
  const actions = el("div",{style:"display:flex;gap:10px;margin-top:8px;"});
  const saveBtn = el("button",{style:`flex:1;background:var(--gold);color:var(--bg);border:none;border-radius:12px;padding:13px 0;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;opacity:${state.saving?0.7:1};`},[
    el("span",{html: state.saving ? '<div class="spin" style="width:16px;height:16px;border:2px solid var(--bg);border-top-color:transparent;border-radius:50%;"></div>' : ICONS.save}),
    state.saving ? "Enregistrement…" : "Enregistrer le trade",
  ]);
  saveBtn.addEventListener("click", ()=>{
    if(!f.marche.trim()){ state.error = "Indique le marché (ex. XAUUSD, NAS100) avant d'enregistrer."; render(); return; }
    state.saving = true; state.error=""; render();
    setTimeout(async ()=>{
      const id = f.id || `${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
      const toSave = {...f, id};
      const idx = state.trades.findIndex(t=>t.id===id);
      if(idx>=0) state.trades[idx] = toSave; else state.trades.push(toSave);
      const ok = await persistTrades();
      state.saving = false;
      if(ok){ await loadTrades(); state.view="list"; }
      render();
    }, 150);
  });
  actions.appendChild(saveBtn);

  if(f.id){
    const delBtn = el("button",{style:"width:48px;background:#1A1216;border:1px solid #3A2226;border-radius:12px;color:var(--red);display:flex;align-items:center;justify-content:center;","aria-label":"Supprimer",html:ICONS.trash});
    delBtn.addEventListener("click", async ()=>{
      state.trades = state.trades.filter(t=>t.id!==f.id);
      await persistTrades();
      await loadTrades();
      state.view="list"; render();
    });
    actions.appendChild(delBtn);
  }
  body.appendChild(actions);
  wrap.appendChild(body);
  return wrap;
}

function field(label, content){
  return el("div",{class:"field"},[ el("div",{class:"field-label"}, label), content ]);
}
function toggleBtn(label, active, color, iconHtml, onClick){
  const btn = el("button",{class:"btn-toggle"+(active?" active":""), style:`--c:${color};`});
  if(iconHtml) btn.innerHTML += `<span style="display:flex;">${iconHtml}</span>`;
  btn.appendChild(document.createTextNode(label));
  btn.addEventListener("click", onClick);
  return btn;
}

/* ---------- Install prompt ---------- */
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  if(!localStorage.getItem("le_raid_install_dismissed")){
    document.getElementById("install-banner").classList.add("show");
  }
});
document.getElementById("install-btn").addEventListener("click", async ()=>{
  document.getElementById("install-banner").classList.remove("show");
  if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; }
});
document.getElementById("dismiss-btn").addEventListener("click", ()=>{
  document.getElementById("install-banner").classList.remove("show");
  localStorage.setItem("le_raid_install_dismissed","1");
});

/* ---------- Service worker ---------- */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

/* ---------- Init ---------- */
(async function init(){
  await loadTrades();
  checkMonthlyRecap();
  checkWeeklyRecap();
  render();
})();
</script>
</body>
</html>
